<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>PRISM PATH ─ プリズム・パス</title>
<style>
:root{
  --bg:#05070f;--panel:#0d1424;--panel2:#131c31;--line:#223252;--line2:#2e4368;
  --text:#e9efff;--dim:#8ea1c6;--cyan:#5fe9ff;--amber:#ffd166;--violet:#a98bff;--danger:#ff7a7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);overscroll-behavior:none;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Malgun Gothic",
              -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
#app{
  max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(125% 55% at 50% -8%,#17264f 0%,rgba(10,14,28,0) 62%),
    radial-gradient(95% 45% at 50% 108%,#1d1342 0%,rgba(10,14,28,0) 66%),
    var(--bg);
  box-shadow:0 0 0 1px #0d1730;
}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(120,170,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.05) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(80% 60% at 50% 20%,#000,transparent 78%)}
/* ---------- top bar ---------- */
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;position:relative;z-index:5}
.brand{font-weight:800;letter-spacing:.16em;font-size:14px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand em{font-style:normal;color:var(--cyan)}
.icon-btn{all:unset;display:grid;place-items:center;width:36px;height:36px;border-radius:11px;color:var(--dim);
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.icon-btn:active{transform:scale(.94)}
.icon-btn.on{color:#06121c;background:linear-gradient(180deg,#8ef0ff,#3ecbe8);box-shadow:0 0 14px rgba(95,233,255,.45)}
.lang-wrap{display:flex;align-items:center;gap:4px;padding:0 6px 0 9px;height:36px;border-radius:11px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px var(--line);color:var(--dim)}
.lang-wrap svg{width:17px;height:17px;flex:none}
#selLang{all:unset;color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;padding-right:2px;max-width:86px}
#selLang option{color:#000}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* ---------- screens ---------- */
main{flex:1;display:flex;min-height:0;position:relative;z-index:2}
.screen{display:none;flex-direction:column;flex:1;min-height:0;padding:4px 16px calc(env(safe-area-inset-bottom) + 16px);overflow:auto}
.screen.on{display:flex;animation:fadeUp .28s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.scr-title{font-size:13px;letter-spacing:.2em;color:var(--dim);margin:10px 2px 14px;font-weight:700}
/* ---------- home ---------- */
#scr-home{justify-content:center;gap:26px}
.hero{text-align:center;margin-top:-4vh}
.logo-big{font-size:clamp(30px,10vw,42px);font-weight:900;letter-spacing:.1em;line-height:1.05;position:relative;display:inline-block}
.logo-big em{font-style:normal;color:var(--cyan);text-shadow:0 0 26px rgba(95,233,255,.7)}
.logo-big .rail{display:block;height:3px;width:88%;margin:12px auto 0;border-radius:99px;
  background:linear-gradient(90deg,transparent,var(--cyan),#fff,var(--violet),transparent);box-shadow:0 0 18px rgba(95,233,255,.6)}
.tagline{color:var(--dim);font-size:13.5px;margin:14px 0 0;line-height:1.7}
.menu{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{all:unset;cursor:pointer;text-align:center;padding:13px 12px;border-radius:14px;font-weight:700;font-size:14.5px;
  background:linear-gradient(180deg,#1a2440,#121a2e);box-shadow:inset 0 0 0 1px var(--line),0 3px 0 rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text);transition:.12s}
.btn:active{transform:translateY(2px) scale(.99)}
.btn.primary{background:linear-gradient(180deg,#7ee9ff,#35bfe0 60%,#1fa5cc);color:#04121c;box-shadow:0 0 26px rgba(95,233,255,.35),inset 0 0 0 1px #a9f2ff}
.btn.big{padding:18px 12px;font-size:17px}
.btn .sub{font-size:11.5px;font-weight:600;opacity:.75;letter-spacing:.04em}
.btn.ghost{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;color:var(--dim)}
.foot-note{color:#5f7099;font-size:11px;text-align:center;margin:6px 0 0;line-height:1.6}
/* ---------- level grid ---------- */
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding-bottom:10px}
.lv{all:unset;cursor:pointer;aspect-ratio:1/.98;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:linear-gradient(180deg,#16203a,#101728);box-shadow:inset 0 0 0 1px var(--line);font-weight:800;font-size:16px}
.lv.done{box-shadow:inset 0 0 0 1px #2f6d84,0 0 14px rgba(95,233,255,.14)}
.lv:active{transform:scale(.95)}
.lv.locked{color:#4a5c80;background:rgba(255,255,255,.02);cursor:not-allowed}
.lv .dots{display:flex;gap:3px}
.lv .dots i{width:5px;height:5px;border-radius:50%;background:#2d3f61;display:block}
.lv .dots i.f{background:var(--amber);box-shadow:0 0 6px rgba(255,209,102,.8)}
/* zen */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{all:unset;cursor:pointer;padding:10px 14px;border-radius:99px;font-size:13px;font-weight:700;color:var(--dim);
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line)}
.chip.sel{color:#04121c;background:linear-gradient(180deg,#c9b3ff,#a98bff);box-shadow:0 0 18px rgba(169,139,255,.4)}
.statcard{padding:14px;border-radius:14px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line);
  font-size:12.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;line-height:1.6}
.statcard b{color:var(--text)}
/* ---------- game ---------- */
#scr-game{padding-left:12px;padding-right:12px;overflow:hidden}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 10px}
.hud .lvname{font-weight:900;font-size:15px;letter-spacing:.06em}
.hud .best{display:flex;gap:3px;margin-top:4px}
.stats{display:flex;gap:12px;text-align:right}
.stat{display:flex;flex-direction:column;gap:2px;line-height:1}
.stat span{font-size:9.5px;color:#6d80a8;letter-spacing:.1em;font-weight:700}
.stat b{font-size:16px;font-variant-numeric:tabular-nums}
.stat b.par{color:var(--cyan)}
.boardwrap{flex:1;display:grid;place-items:center;min-height:0;padding:2px 0 8px}
.board{display:grid;gap:5px;padding:9px;border-radius:18px;background:linear-gradient(180deg,#0f1729,#0b1120);
  box-shadow:inset 0 0 0 1px var(--line),0 10px 34px rgba(0,0,0,.55)}
.cell{position:relative;border-radius:9px;background:#101a2e;box-shadow:inset 0 0 0 1px #1b2942;overflow:hidden}
.segs{position:absolute;inset:0}
.seg{position:absolute;background:linear-gradient(180deg,#c9fbff,var(--cyan) 55%,#3ab9e0);border-radius:3px;--t:var(--bw,6px);
  box-shadow:0 0 7px rgba(95,233,255,.9),0 0 18px rgba(95,233,255,.35)}
.seg.u{left:calc(50% - var(--t)/2);top:0;width:var(--t);height:calc(50% + var(--t)/2);transform-origin:bottom;animation:sy .16s ease-out both;animation-delay:var(--d,0ms)}
.seg.d{left:calc(50% - var(--t)/2);bottom:0;width:var(--t);height:calc(50% + var(--t)/2);transform-origin:top;animation:sy .16s ease-out both;animation-delay:var(--d,0ms)}
.seg.l{top:calc(50% - var(--t)/2);left:0;height:var(--t);width:calc(50% + var(--t)/2);transform-origin:right;animation:sx .16s ease-out both;animation-delay:var(--d,0ms)}
.seg.r{top:calc(50% - var(--t)/2);right:0;height:var(--t);width:calc(50% + var(--t)/2);transform-origin:left;animation:sx .16s ease-out both;animation-delay:var(--d,0ms)}
@keyframes sy{from{opacity:.15;transform:scaleY(.05)}to{opacity:1;transform:scaleY(1)}}
@keyframes sx{from{opacity:.15;transform:scaleX(.05)}to{opacity:1;transform:scaleX(1)}}
.piece-wrap{position:absolute;inset:0;display:grid;place-items:center}
.piece{transition:transform .19s cubic-bezier(.34,1.6,.64,1),box-shadow .2s,background .2s}
.p-emit{width:66%;height:66%;border-radius:20%;position:relative;background:linear-gradient(150deg,#2b3d63,#16203a);
  box-shadow:inset 0 0 0 1.5px #4f7fb5,0 0 14px rgba(95,233,255,.35)}
.p-emit::after{content:"";position:absolute;left:50%;top:50%;width:26%;height:26%;background:var(--cyan);border-radius:50%;
  transform:translate(-50%,-50%) translateY(-42%) rotate(0deg);box-shadow:0 0 10px var(--cyan)}
.p-emit.e0::after{transform:translate(-50%,-50%) translateY(-42%)}
.p-emit.e1::after{transform:translate(-50%,-50%) rotate(90deg) translateY(-42%)}
.p-emit.e2::after{transform:translate(-50%,-50%) rotate(180deg) translateY(-42%)}
.p-emit.e3::after{transform:translate(-50%,-50%) rotate(270deg) translateY(-42%)}
.p-mirror{width:74%;height:13%;min-height:5px;border-radius:99px;background:linear-gradient(180deg,#f2fbff,#9dc6e4 45%,#4c6c8d);
  box-shadow:0 0 10px rgba(150,225,255,.55)}
.p-mirror.o0{transform:rotate(-45deg)}.p-mirror.o1{transform:rotate(45deg)}
.p-split{width:74%;height:13%;min-height:5px;border-radius:99px;position:relative;
  background:linear-gradient(90deg,rgba(206,190,255,.95),rgba(169,139,255,.28));box-shadow:0 0 10px rgba(169,139,255,.5)}
.p-split.o0{transform:rotate(-45deg)}.p-split.o1{transform:rotate(45deg)}
.p-split::after{content:"";position:absolute;left:50%;top:50%;width:42%;height:210%;transform:translate(-50%,-50%);border-radius:99px;
  background:none}
.cell.fix .p-split{outline:none}
.p-bulb{width:56%;height:56%;border-radius:50%;background:#16203a;border:2px solid #3c5480}
.p-bulb.lit{border-color:#ffeab5;background:radial-gradient(circle at 36% 30%,#fffbe8,#ffd166 58%,#e39a22);
  box-shadow:0 0 14px #ffd166,0 0 34px rgba(255,209,102,.55);animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px #ffd166,0 0 52px rgba(255,209,102,.65)}}
.p-wall{width:84%;height:84%;border-radius:15%;background:repeating-linear-gradient(45deg,#1a2440,#1a2440 4px,#243357 4px,#243357 8px);
  box-shadow:inset 0 0 0 1px #30456e}
.cell.tap{cursor:pointer}
.cell.hintflash::after{content:"";position:absolute;inset:0;border-radius:9px;background:rgba(255,209,102,.28);animation:hf .7s ease-out 2;pointer-events:none}
@keyframes hf{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.controls{display:flex;gap:8px;padding-top:4px}
.ctl{flex:1;font-size:12.5px;padding:11px 6px;gap:5px;border-radius:13px}
.ctl .ic{width:17px;height:17px;margin:0 auto}
.board.solved{animation:winflash .55s ease-out 2}
@keyframes winflash{50%{box-shadow:inset 0 0 0 1px #7ff0ff,0 0 60px rgba(95,233,255,.5)}}
/* ---------- help ---------- */
.legend{display:flex;flex-direction:column;gap:11px;margin:4px 0 20px}
.leg{display:flex;align-items:center;gap:13px;font-size:13px;color:var(--dim);line-height:1.6}
.leg .mini{width:38px;height:38px;border-radius:9px;background:#101a2e;box-shadow:inset 0 0 0 1px #1b2942;display:grid;place-items:center;flex:none;position:relative}
.leg .mini .piece{position:static}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:11px;font-size:13.5px;line-height:1.75;color:#c4d2ee}
.rules li::marker{color:var(--cyan);font-weight:800}
#demoBoard{margin:18px auto 6px;pointer-events:none}
.demo-cap{text-align:center;font-size:11.5px;color:#5f7099;letter-spacing:.1em}
/* ---------- settings ---------- */
.set-group{border-radius:15px;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:14px;overflow:hidden}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;font-size:13.5px;border-top:1px solid #17233c}
.set-row:first-child{border-top:none}
.set-row small{display:block;color:#6d80a8;font-size:11px;margin-top:3px;line-height:1.5}
.sw{all:unset;cursor:pointer;width:50px;height:29px;border-radius:99px;background:#22304e;position:relative;transition:.18s;flex:none;box-shadow:inset 0 0 0 1px var(--line2)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#7d8fb5;transition:.18s}
.sw.on{background:linear-gradient(90deg,#35bfe0,#7ee9ff)}
.sw.on::after{left:24px;background:#04121c}
.txt{width:100%;min-height:76px;resize:vertical;border-radius:11px;padding:10px;font-size:11.5px;color:#cfe3ff;
  background:#0a1020;box-shadow:inset 0 0 0 1px var(--line);border:none;font-family:ui-monospace,Menlo,Consolas,monospace;user-select:text}
.mt{margin-top:12px}
.danger{color:var(--danger)}
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(3,6,14,.7);backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;animation:fade .2s ease-out}
.overlay.hidden{display:none}
@keyframes fade{from{opacity:0}}
.sheet{width:min(94vw,380px);max-height:86dvh;overflow:auto;border-radius:22px;padding:22px 20px;text-align:center;
  background:linear-gradient(180deg,#16203a,#0d1424);box-shadow:inset 0 0 0 1px var(--line2),0 24px 60px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:translateY(22px) scale(.96);opacity:0}}
.sheet h3{margin:0 0 6px;font-size:20px;letter-spacing:.04em}
.sheet p.sub{color:var(--dim);font-size:12.5px;margin:0 0 16px;line-height:1.6}
.bigstars{display:flex;justify-content:center;gap:8px;margin:10px 0 18px}
.bigstars svg{width:38px;height:38px;stroke-width:1.6}
.bigstars .s{fill:#1d2a45;stroke:#33486f}
.bigstars .s.f{fill:url(#gstar);stroke:#ffe9a8;filter:drop-shadow(0 0 9px rgba(255,209,102,.75))}
.res{display:flex;justify-content:center;gap:20px;margin-bottom:18px}
.res div{font-size:10.5px;color:#6d80a8;letter-spacing:.1em}
.res b{display:block;font-size:19px;color:var(--text);margin-top:4px;font-variant-numeric:tabular-nums}
.sheet .btns{display:flex;flex-direction:column;gap:9px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%);z-index:60;
  padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:700;background:#0f1b30;color:#cfe3ff;
  box-shadow:inset 0 0 0 1px var(--line2),0 8px 24px rgba(0,0,0,.5);animation:tst .25s ease-out}
@keyframes tst{from{opacity:0;transform:translate(-50%,12px)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gstar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff4cf"/><stop offset=".55" stop-color="#ffd166"/><stop offset="1" stop-color="#e39a22"/>
  </linearGradient>
</defs></svg>

<div id="app">
  <header>
    <button class="icon-btn" id="btnBack" style="display:none"></button>
    <div class="brand">PRISM<em>PATH</em></div>
    <label class="lang-wrap"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 2.6 15 0 18-2.6-3-2.6-15 0-18z"/></svg>
      <select id="selLang" aria-label="Language"></select></label>
    <button class="icon-btn" id="btnSound" aria-label="sound"></button>
  </header>

  <main>
    <!-- HOME -->
    <section class="screen on" id="scr-home">
      <div class="hero">
        <div class="logo-big">PRISM<em>PATH</em><span class="rail"></span></div>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <div class="menu">
        <button class="btn primary big" id="mPlay"><span data-i18n="play"></span><span class="sub" id="mPlaySub"></span></button>
        <div class="row">
          <button class="btn" id="mLevels"><span data-i18n="levels"></span></button>
          <button class="btn" id="mZen"><span data-i18n="challenge"></span></button>
        </div>
        <div class="row">
          <button class="btn ghost" id="mHelp"><span data-i18n="howto"></span></button>
          <button class="btn ghost" id="mSet"><span data-i18n="settings"></span></button>
        </div>
      </div>
      <p class="foot-note" data-i18n="save_note"></p>
    </section>

    <!-- LEVELS -->
    <section class="screen" id="scr-levels">
      <h2 class="scr-title" data-i18n="lv_title"></h2>
      <div class="lvgrid" id="levelGrid"></div>
    </section>

    <!-- ZEN -->
    <section class="screen" id="scr-zen">
      <h2 class="scr-title" data-i18n="zen_title"></h2>
      <div class="chips" id="zenChips"></div>
      <div class="statcard" id="zenStat"></div>
      <button class="btn primary big" id="zenGo"><span data-i18n="zen_go"></span></button>
      <p class="foot-note" data-i18n="zen_note"></p>
    </section>

    <!-- GAME -->
    <section class="screen" id="scr-game">
      <div class="hud">
        <div><div class="lvname" id="gName">Lv.1</div><div class="best" id="gBest"></div></div>
        <div class="stats">
          <div class="stat"><span data-i18n="moves"></span><b id="gMoves">0</b></div>
          <div class="stat"><span data-i18n="par"></span><b class="par" id="gPar">0</b></div>
          <div class="stat"><span data-i18n="time"></span><b id="gTime">0:00</b></div>
        </div>
      </div>
      <div class="boardwrap" id="boardWrap"><div class="board" id="board"></div></div>
      <div class="controls">
        <button class="btn ctl" id="btnUndo"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h9a6 6 0 110 12H8"/></svg><span data-i18n="undo"></span></button>
        <button class="btn ctl" id="btnHint"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 014 12.7V17H8v-2.3A7 7 0 0112 2z"/></svg><span data-i18n="hint"></span></button>
        <button class="btn ctl" id="btnReset"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11A8 8 0 106.7 18.7"/><path d="M20 4v7h-7"/></svg><span data-i18n="reset"></span></button>
      </div>
    </section>

    <!-- HELP -->
    <section class="screen" id="scr-help">
      <h2 class="scr-title" data-i18n="howto"></h2>
      <div class="legend" id="legend"></div>
      <ol class="rules" id="rules"></ol>
      <div class="boardwrap" style="flex:none"><div class="board" id="demoBoard"></div></div>
      <p class="demo-cap">EXAMPLE</p>
    </section>

    <!-- SETTINGS -->
    <section class="screen" id="scr-settings">
      <h2 class="scr-title" data-i18n="settings"></h2>
      <div class="set-group">
        <div class="set-row"><div data-i18n="set_lang"></div><label class="lang-wrap" style="height:34px"><select id="selLang2"></select></label></div>
        <div class="set-row"><div><span data-i18n="set_sound"></span><small data-i18n="set_sound_s"></small></div><button class="sw" id="swSound"></button></div>
        <div class="set-row"><div><span data-i18n="set_haptics"></span><small data-i18n="set_haptics_s"></small></div><button class="sw" id="swVib"></button></div>
      </div>
      <div class="set-group">
        <div class="set-row"><div><span data-i18n="set_data"></span><small data-i18n="set_data_s"></small></div></div>
        <div style="padding:0 14px 14px;display:flex;gap:8px">
          <button class="btn ghost" id="btnExp" style="flex:1"><span data-i18n="exp"></span></button>
          <button class="btn ghost" id="btnImp" style="flex:1"><span data-i18n="imp"></span></button>
        </div>
        <div class="set-row"><div><span data-i18n="reset_progress"></span><small data-i18n="reset_progress_s"></small></div>
          <button class="btn ghost danger" id="btnWipe" style="padding:9px 13px"><span data-i18n="wipe"></span></button></div>
      </div>
      <p class="foot-note" data-i18n="credits"></p>
    </section>
  </main>
</div>

<div id="modal" class="overlay hidden"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
/* ============================================================
   PRISM PATH — 思考系レーザーパズル

const Snd={ctx:null,
  boot(){if(this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();}catch(e){}},
  resume(){if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();},
  tone(f,dur,type,vol,t0,slide){
    if(!S.save.sound)return;this.boot();if(!this.ctx)return;this.resume();
    const c=this.ctx,st=c.currentTime+(t0||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||"triangle";o.frequency.setValueAtTime(f,st);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),st+dur);
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol||.12,st+.008);
    g.gain.exponentialRampToValueAtTime(.0008,st+dur);
    o.connect(g).connect(c.destination);o.start(st);o.stop(st+dur+.03);
  },
  tap(o){this.tone(o?420:520,.07,"square",.06,o?.9:.85)},
  flow(n){this.tone(300+n*18,.13,"sine",.04,0,2.2)},
  light(k){this.tone(660*Math.pow(1.0595,k*3),.24,"sine",.11)},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.4,"triangle",.11,i*.1));this.tone(1568,.6,"sine",.05,.4)},

/* ---------------- puzzle engine ---------------- */
const DX=[0,1,0,-1],DY=[-1,0,1,0],OPP=[2,3,0,1],RU=[1,0,3,2],RD=[3,2,1,0];
const refl=(d,o)=>o?RD[d]:RU[d];

function computeBeams(C,R,cells){
  const N=C*R,segs=new Array(N).fill(0),dist=new Array(N).fill(-1),lit=new Set(),seen=new Set(),q=[];
  const set=(i,d,dd)=>{segs[i]|=1<<d;if(dist[i]<0||dd<dist[i])dist[i]=dd;};
  const push=(i,x,y,d,dd)=>{const k=i*4+d;if(seen.has(k))return;seen.add(k);set(i,d,dd);q.push({x,y,d,dist:dd});};
  for(let i=0;i<N;i++){const c=cells[i];if(c&&c.t==="E"){set(i,c.d,0);q.push({x:i%C,y:(i/C)|0,d:c.d,dist:0});}}
  let guard=0,max=N*6+40;
  while(q.length&&guard++<max){
    const b=q.shift(),nx=b.x+DX[b.d],ny=b.y+DY[b.d];
    if(nx<0||ny<0||nx>=C||ny>=R)continue;
    const ni=ny*C+nx,c=cells[ni];
    if(!c||c.t==="W"||c.t==="E")continue;
    const dd=b.dist+1;set(ni,OPP[b.d],dd);
    if(c.t===".")push(ni,nx,ny,b.d,dd);
    else if(c.t==="M")push(ni,nx,ny,refl(b.d,c.o),dd);
    else if(c.t==="S"){push(ni,nx,ny,b.d,dd);push(ni,nx,ny,refl(b.d,c.o),dd);}
    else if(c.t==="T")lit.add(ni);
  }
  return{segs,dist,lit};
}
function isSolved(C,R,cells){
  let n=0;for(const c of cells)if(c.t==="T")n++;
  if(!n)return false;
  return computeBeams(C,R,cells).lit.size>=n;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
function hash(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}

const TIERS=[
 {C:4,R:5,T:1,split:false,minLen:2,mirMin:1,mirMax:3,walls:0},
 {C:4,R:6,T:1,split:false,minLen:3,mirMin:2,mirMax:4,walls:1},
 {C:5,R:6,T:2,split:true ,minLen:2,mirMin:2,mirMax:5,walls:2},
 {C:5,R:7,T:2,split:true ,minLen:3,mirMin:3,mirMax:6,walls:3},
 {C:6,R:8,T:3,split:true ,minLen:3,mirMin:4,mirMax:8,walls:4},
 {C:7,R:9,T:3,split:true ,minLen:4,mirMin:5,mirMax:10,walls:6}
];
function tierOf(id){return id<=3?0:id<=8?1:id<=15?2:id<=23?3:id<=32?4:5;}
const ZEN={easy:{...TIERS[1],walls:1},normal:{...TIERS[3]},hard:{...TIERS[4],mirMax:9},expert:{...TIERS[5],mirMax:12,walls:8}};

function tryBuild(rnd,cfg){
  const C=cfg.C,R=cfg.R,N=C*R,cells=new Array(N).fill(null).map(()=>({t:"."}));
  const used=new Set(),path=new Set();
  let mirrors=0,splits=0;
  const maxS=cfg.split?Math.max(0,cfg.T-1):0,maxM=cfg.mirMax;
  const inB=(x,y)=>x>=0&&y>=0&&x<C&&y<R;
  const free=(x,y)=>inB(x,y)&&!used.has(y*C+x);
  const side=(rnd()*4)|0;let ex,ey,ed;
  if(side===0){ex=0;ey=(rnd()*R)|0;ed=1;}
  else if(side===1){ex=C-1;ey=(rnd()*R)|0;ed=3;}
  else if(side===2){ex=(rnd()*C)|0;ey=0;ed=2;}
  else{ex=(rnd()*C)|0;ey=R-1;ed=0;}
  cells[ey*C+ex]={t:"E",d:ed};used.add(ey*C+ex);

  const turnsAt=(x,y,d)=>{const out=[];for(let k=0;k<4;k++){const p=(d+1+2*k)%4;if(k>1)break;}
    /* perpendicular only */ [ (d+1)%4,(d+3)%4 ].forEach(p=>{if(free(x+DX[p],y+DY[p]))out.push(p);});return out;};
  const oFor=(d,nd)=>{for(let o=0;o<2;o++)if(refl(d,o)===nd)return o;return -1;};

  function build(x,y,d,k,depth){
    if(k<=0)return true;
    if(depth>cfg.T+3)return false;
    let segLen=0,steps=0;
    while(true){
      if(++steps>N*3+20)return false;
      const nx=x+DX[d],ny=y+DY[d];
      if(free(nx,ny)){
        const ni=ny*C+nx,canPlace=!path.has(ni);
        if(canPlace){
          if(k===1&&segLen>=cfg.minLen&&rnd()<0.5){cells[ni]={t:"T"};used.add(ni);return true;}
          if(k>1&&splits<maxS&&segLen>=1&&rnd()<0.55){
            const o=(rnd()*2)|0,rd=refl(d,o);
            if(rd===d)return false;
            cells[ni]={t:"S",o};used.add(ni);splits++;
            const k1=1+((rnd()*k)|0),k2=k-k1;
            if(k2>=1&&build(nx,ny,d,k1,depth+1)&&build(nx,ny,rd,k2,depth+1))return true;
            cells[ni]={t:"."};used.delete(ni);splits--;return false;
          }
        }
        const cont=free(nx+DX[d],ny+DY[d]);
        const tr=canPlace?turnsAt(nx,ny,d):[];
        if(cont&&(tr.length===0||!canPlace||rnd()<0.62)){path.add(ni);x=nx;y=ny;segLen++;continue;}
        if(tr.length&&mirrors<maxM){
          const nd=tr[(rnd()*tr.length)|0],o=oFor(d,nd);if(o<0)return false;
          cells[ni]={t:"M",o};used.add(ni);mirrors++;x=nx;y=ny;d=nd;segLen=0;continue;
        }
        if(cont){path.add(ni);x=nx;y=ny;segLen++;continue;}
        return false;
      }else{
        const cur=y*C+x;
        if(used.has(cur))return false;
        if(mirrors>=maxM)return false;
        const tr=turnsAt(x,y,d);if(!tr.length)return false;
        const nd=tr[(rnd()*tr.length)|0],o=oFor(d,nd);if(o<0)return false;
        cells[cur]={t:"M",o};used.add(cur);mirrors++;d=nd;segLen=0;continue;
      }
    }
  }
  if(!build(ex,ey,ed,cfg.T,0))return null;

  /* solution must really light every lamp */
  const sol=cells.map(c=>c.o);
  if(!isSolved(C,R,cells))return null;
  let tc=0,mi=0;const mIdx=[];
  cells.forEach((c,i)=>{if(c.t==="T")tc++;if(c.t==="M"){mi++;mIdx.push(i);}});
  if(tc!==cfg.T||mi<cfg.mirMin)return null;

  /* decorative walls on unused ground only */
  const spare=[];for(let i=0;i<N;i++)if(cells[i].t==="."&&!path.has(i))spare.push(i);
  for(let i=spare.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[spare[i],spare[j]]=[spare[j],spare[i]];}
  const nw=Math.min(cfg.walls,Math.max(0,spare.length-4));
  for(let i=0;i<nw;i++)cells[spare[i]]={t:"W"};
  if(!isSolved(C,R,cells)){for(let i=0;i<nw;i++)cells[spare[i]]={t:"."};if(!isSolved(C,R,cells))return null;}

  /* shuffle mirrors -> puzzle */
  for(let s=0;s<90;s++){
    let wrong=0;
    mIdx.forEach(i=>{const o=(rnd()*2)|0;cells[i].o=o;if(o!==sol[i])wrong++;});
    if(wrong<Math.max(1,Math.min(cfg.mirMin,3)))continue;
    if(isSolved(C,R,cells))continue;
    return{C,R,cells:cells.map(c=>({...c})),par:wrong};
  }
  return null;
}
function fallbackPuzzle(cfg){
  const C=Math.max(4,cfg.C),R=Math.max(5,cfg.R),N=C*R,cells=new Array(N).fill(null).map(()=>({t:"."}));
  cells[0*C+0]={t:"E",d:2};
  cells[(R-1)*C+0]={t:"M",o:1};
  cells[(R-1)*C+(C-1)]={t:"T"};
  if(cfg.T>1){cells[0*C+(C-1)]={t:"E"===cells[0*C+(C-1)].t?"W":"."};}
  const sol=cells.map(c=>c.o);
  cells[(R-1)*C+0].o=sol[(R-1)*C+0]===0?1:0;
  return{C,R,cells,par:1};
}
function buildPuzzle(seed,cfg){
  const rnd=mulberry32(hash(seed));
  for(let a=0;a<900;a++){const p=tryBuild(rnd,cfg);if(p)return p;}
  return fallbackPuzzle(cfg);
}

/* ---------------- board view ---------------- */
class Board{
  constructor(el,C,R,cells,interactive){
    this.el=el;this.C=C;this.R=R;this.cells=cells.map(c=>({...c}));this.interactive=!!interactive;
    const N=C*R;this.segs=new Array(N).fill(0);this.dist=new Array(N).fill(-1);this.lit=new Set();
    el.innerHTML="";el.style.setProperty("--c",C);
    el.style.gridTemplateColumns=`repeat(${C},1fr)`;
    this.refs=[];
    for(let i=0;i<N;i++){
      const c=document.createElement("div");c.className="cell";c.dataset.i=i;
      const s=document.createElement("div");s.className="segs";
      const w=document.createElement("div");w.className="piece-wrap";
      c.append(s,w);el.append(c);
      let p=null;const ct=this.cells[i].t;
      if(ct!=="."){p=document.createElement("div");w.append(p);}
      this.refs.push({el:c,segs:s,piece:p});
      if(this.interactive&&ct==="M")c.classList.add("tap");
      this.applyPiece(i,false);
    }
  }
  applyPiece(i,lit){
    const c=this.cells[i],p=this.refs[i].piece;if(!p)return;
    const cls={E:"p-emit",M:"p-mirror",S:"p-split",T:"p-bulb",W:"p-wall"}[c.t]||"";
    p.className="piece "+cls+(c.o!==undefined&&c.t!=="E"?" o"+c.o:"")+(c.t==="E"?" e"+c.d:"")+(lit?" lit":"");
  }
  trace(){
    const b=computeBeams(this.C,this.R,this.cells);
    this.segs=b.segs;this.dist=b.dist;const prev=this.lit;this.lit=b.lit;return prev;
  }
  paint(){
    const N=this.C*this.R,CLS=["u","r","d","l"];
    for(let i=0;i<N;i++){
      let h="";const dl=Math.round(Math.max(0,this.dist[i]<0?0:this.dist[i])*26);
      for(let d=0;d<4;d++)if(this.segs[i]&(1<<d))h+=`<i class="seg ${CLS[d]}" style="--d:${dl}ms"></i>`;
      this.refs[i].segs.innerHTML=h;
      this.applyPiece(i,this.lit.has(i));
    }
  }
  setMirror(i,o){this.cells[i].o=o;this.applyPiece(i,this.lit.has(i));}
  mirrorIdx(){const a=[];this.cells.forEach((c,i)=>{if(c.t==="M")a.push(i);});return a;}
}

/* ---------------- navigation ---------------- */
const SCREENS=["home","levels","zen","game","help","settings"];
function show(name){
  S.screen=name;
  SCREENS.forEach(s=>$("#scr-"+s).classList.toggle("on",s===name));
  $("#btnBack").style.display=(name==="home"||name==="game")?"none":"grid";
  if(name==="levels")renderLevels();
  if(name==="zen")renderZen();
  if(name==="settings")syncSettings();
  if(name==="help")makeDemo();
  requestAnimationFrame(()=>{if(G.board)fitBoard(G.board);if(S.demoBoard)fitBoard(S.demoBoard);});
}

/* ---------------- game state ---------------- */
const G={mode:"level",id:1,board:null,par:0,moves:0,hints:0,solved:false,undo:[],tBase:0,t0:0,timer:null,busy:false};
function fitBoard(b){
  const wrap=b.el.parentElement;if(!wrap)return;
  const w=wrap.clientWidth-6,h=wrap.clientHeight-6;
  if(w<=0||h<=0)return;
  const cs=Math.max(22,Math.min(w/b.C,h/b.R));
  b.el.style.width=(cs*b.C)+"px";b.el.style.height=(cs*b.R)+"px";
  b.el.style.setProperty("--bw",Math.max(4,Math.round(cs*.1))+"px");
}
function fmtTime(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function elapsed(){return G.tBase+(G.timer?Date.now()-G.t0:0);}
function startTimer(){if(G.timer)clearInterval(G.timer);G.t0=Date.now();G.timer=setInterval(()=>{$("#gTime").textContent=fmtTime(elapsed());},300);}
function stopTimer(){if(G.timer){clearInterval(G.timer);G.timer=null;G.tBase+=Date.now()-G.t0;}}

function startPuzzle(mode,idOrDiff){
  let cfg,seed,name;
  if(mode==="level"){const id=idOrDiff;cfg=TIERS[tierOf(id)];seed="pp:"+id+":v1";name=t("lv_short")+id;}
  else{const d=idOrDiff;cfg=ZEN[d];seed="zen:"+d+":"+Date.now()+Math.random();name=t("diff_"+d==="diff_"+d?"CHALLENGE":t("diff_"+d));}
  const p=buildPuzzle(seed,cfg);
  G.mode=mode;G.id=idOrDiff;G.board=new Board($("#board"),p.C,p.R,p.cells,true);
  G.par=p.par;G.moves=0;G.hints=0;G.solved=false;G.busy=false;G.undo=[];G.tBase=0;
  $("#board").classList.remove("solved");
  $("#gName").textContent=(mode==="level")?t("lv_short")+idOrDiff:t("challenge")+(name&&name!=="CHALLENGE"?" · "+name:"");
  const rec=(mode==="level")?S.save.lv[idOrDiff]:null;
  $("#gBest").innerHTML=rec?starRow(rec.stars):"";
  updateHUD();startTimer();
  show("game");
  requestAnimationFrame(()=>{fitBoard(G.board);G.board.trace();G.board.paint();});
}
function starRow(n){let h="";for(let i=0;i<3;i++)h+=`<svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:${i<n?"#ffd166":"#2a3a5c"};stroke:none"><path d="M12 2l3 6.7 7.3.8-5.4 4.9 1.5 7.1L12 17.8 5.6 21.5l1.5-7.1L1.7 9.5 9 8.7z"/></svg>`;return h;}
function updateHUD(){$("#gMoves").textContent=G.moves;$("#gPar").textContent=G.par;}

function onCellTap(i){
  if(G.solved||G.busy||!G.board)return;
  const c=G.board.cells[i];if(!c||c.t!=="M")return;
  G.undo.push({i,o:c.o});
  const no=c.o===0?1:0;
  G.board.setMirror(i,no);G.moves++;updateHUD();
  Snd.tap(no);buzz(8);
  const prev=G.board.trace();G.board.paint();
  const newly=[...G.board.lit].filter(x=>!prev.has(x));
  newly.forEach((_,k)=>setTimeout(()=>Snd.light(k),k*70));
  if(newly.length)Snd.flow(newly.length);
  if(isSolved(G.board.C,G.board.R,G.board.cells))win();
}
function win(){
  G.solved=true;G.busy=true;stopTimer();
  $("#board").classList.add("solved");
  Snd.win();buzz([14,50,14,50,26]);
  const ms=elapsed(),moves=G.moves,hints=G.hints,par=G.par;
  let st=moves<=par?3:moves<=par+5?2:1;
  if(hints>0)st=Math.min(st,hints>=2?1:2);
  let extra="";
  if(G.mode==="level"){
    const id=G.id,prev=S.save.lv[id];
    const rec={stars:Math.max(st,prev?prev.stars:0),moves:Math.min(moves,prev?prev.moves:1e9),time:Math.min(ms,prev?prev.time:1e9)};
    S.save.lv[id]=rec;S.save.unlocked=Math.max(S.save.unlocked,Math.min(TOTAL,id+1));extra=t("lv_short")+id;
  }else{
    const d=G.diff||G.id,z=S.save.zen;z.plays=(z.plays||0)+1;
    z.best=z.best||{};const prev=z.best[d];
    z.best[d]={moves:Math.min(moves,prev?prev.moves:1e9),time:Math.min(ms,prev?prev.time:1e9)};
  }
  saveNow();
  setTimeout(()=>{
    openModal({title:t("win_title"),sub:t("win_sub"),stars:st,
      res:[[t("moves"),moves],[t("par"),par],[t("time"),fmtTime(ms)]],
      btns:G.mode==="level"
        ?[[t("next"),"primary",()=>{closeModal();if(G.id<TOTAL)startPuzzle("level",G.id+1);else show("levels");}],
          [t("replay"),"",()=>{closeModal();startPuzzle("level",G.id);}],
          [t("to_levels"),"ghost",()=>{closeModal();show("levels");}]]
        :[[t("zen_next"),"primary",()=>{closeModal();startPuzzle("zen",G.id);}],
          [t("to_levels")||t("challenge"),"",()=>{closeModal();show("zen");}]]});
  },820);
}

/* ---------------- level / zen screens ---------------- */
function renderLevels(){
  const g=$("#levelGrid");g.innerHTML="";
  for(let id=1;id<=TOTAL;id++){
    const rec=S.save.lv[id],locked=id>S.save.unlocked;
    const b=document.createElement("button");b.className="lv"+(locked?" locked":"")+(rec?" done":"");
    b.innerHTML=locked
      ?'<svg class="ic" style="width:17px;height:17px;stroke:#4a5c80" viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0110 0v2"/><rect x="4" y="10" width="16" height="11" rx="2.5"/></svg>'
      :`<span>${id}</span><span class="dots">${[0,1,2].map(i=>`<i class="${rec&&rec.stars>i?"f":""}"></i>`).join("")}</span>`;
    b.onclick=()=>{if(locked){Snd.bad();buzz(30);return;}Snd.ui();startPuzzle("level",id);};
    g.append(b);
  }
}
function renderZen(){
  const box=$("#zenChips");box.innerHTML="";
  ["easy","normal","hard","expert"].forEach(d=>{
    const c=document.createElement("button");c.className="chip"+(S.save.diff===d?" sel":"");c.textContent=t("diff_"+d);
    c.onclick=()=>{S.save.diff=d;saveNow();Snd.ui();renderZen();};box.append(c);
  });
  const d=S.save.diff||"normal",b=(S.save.zen.best||{})[d];
  $("#zenStat").innerHTML=t("zen_stat",{p:S.save.zen.plays||0,
    m:b?b.moves:"—",t:b?"("+fmtTime(b.time)+")":"("+t("zen_none")+")"});
}

/* ---------------- help demo ---------------- */
function makeDemo(){
  const C=4,R=3;
  const cells=new Array(C*R).fill(null).map(()=>({t:"."}));
  cells[1*C+0]={t:"E",d:1};
  cells[1*C+2]={t:"S",o:0};   /* '/' : right->up, straight right */
  cells[0*C+2]={t:"T"};
  cells[1*C+3]={t:"M",o:1};
  cells[2*C+3]={t:"T"};
  cells[2*C+1]={t:"W"};
  const b=new Board($("#demoBoard"),C,R,cells,false);
  S.demoBoard=b;b.trace();b.paint();fitBoard(b);
}

/* ---------------- modal / toast ---------------- */
function openModal(o){
  const sh=$("#sheet");
  let h=`<h3>${o.title||""}</h3>`;
  if(o.stars!==undefined)h+=`<div class="bigstars">${[0,1,2].map(i=>`<svg viewBox="0 0 24 24" class="s ${i<o.stars?"f":""}"><path d="M12 2l3 6.7 7.3.8-5.4 4.9 1.5 7.1L12 17.8 5.6 21.5l1.5-7.1L1.7 9.5 9 8.7z"/></svg>`).join("")}</div>`;
  if(o.sub)h+=`<p class="sub">${o.sub}</p>`;
  if(o.res)h+=`<div class="res">${o.res.map(r=>`<div>${r[0]}<b>${r[1]}</b></div>`).join("")}</div>`;
  if(o.body)h+=o.body;
  h+=`<div class="btns" style="margin-top:16px">`;
  (o.btns||[[ "OK","primary",()=>closeModal() ]]).forEach((b,i)=>{h+=`<button class="btn ${b[1]||""}" data-b="${i}">${b[0]}</button>`;});
  h+=`</div>`;sh.innerHTML=h;$("#modal").classList.remove("hidden");
  sh.querySelectorAll("[data-b]").forEach(el=>el.onclick=()=>{Snd.ui();const b=o.btns?o.btns[+el.dataset.b]:null;if(b&&b[2])b[2]();else closeModal();});
  if(o.mount)o.mount(sh);
}
function closeModal(){$("#modal").classList.add("hidden");$("#sheet").innerHTML="";}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.append(d);setTimeout(()=>d.remove(),1700);}

/* ---------------- settings / data ---------------- */
function syncSettings(){
  $("#swSound").classList.toggle("on",S.save.sound);
  $("#swVib").classList.toggle("on",S.save.vib);
  $("#selLang2").value=S.lang;$("#selLang").value=S.lang;
}
function soundIcon(){$("#btnSound").innerHTML=S.save.sound
  ?'<svg class="ic" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/></svg>'
  :'<svg class="ic" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  $("#btnSound").classList.toggle("on",S.save.sound);}
function encodeSave(){
  const bytes=new TextEncoder().encode(JSON.stringify(S.save));let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin);
}
function decodeSave(code){
  const bin=atob(code.trim());const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const p=JSON.parse(new TextDecoder().decode(u));if(!p||p.v!==1)throw 0;return Object.assign(defSave(),p);
}

/* ---------------- i18n apply ---------------- */
function setLang(l){
  S.lang=l;S.save.lang=l;saveNow();applyI18n();
}
function applyI18n(){
  document.documentElement.lang=S.lang==="zh"?"zh-CN":S.lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.title="PRISM PATH ─ "+(S.lang==="ja"?"プリズム・パス":"思考系レーザーパズル");
  const u=Math.min(S.save.unlocked,TOTAL);
  $("#mPlaySub").textContent=(u<=1?t("lv_short")+"1":t("lv_short")+u+" / "+TOTAL);
  soundIcon();syncSettings();
  if(S.screen==="levels")renderLevels();
  if(S.screen==="zen")renderZen();
  buildLegend();
  if(G.board)$("#gName").textContent=(G.mode==="level")?t("lv_short")+G.id:t("challenge");
}
function buildLegend(){
  const L=$("#legend");if(!L)return;
  const items=[["p-emit e1",t("legend_emit")],["p-mirror o0",t("legend_mirror")],["p-split o0",t("legend_split")],["p-bulb lit",t("legend_bulb")],["p-wall",t("legend_wall")]];
  L.innerHTML=items.map(([c,txt])=>`<div class="leg"><div class="mini"><div class="piece ${c}"></div></div><div>${txt}</div></div>`).join("");
  const R=$("#rules");R.innerHTML=[1,2,3,4,5].map(i=>`<li>${t("help_"+i)}</li>`).join("");
}

/* ---------------- wiring ---------------- */
function init(){
  loadSave();pickLang();
  const opts=LANGS.map(([v,n])=>`<option value="${v}">${n}</option>`).join("");
  $("#selLang").innerHTML=opts;$("#selLang2").innerHTML=opts;
  $("#selLang").onchange=e=>{setLang(e.target.value);Snd.ui();};
  $("#selLang2").onchange=e=>{setLang(e.target.value);Snd.ui();};
  $("#btnSound").onclick=()=>{S.save.sound=!S.save.sound;if(S.save.sound){Snd.boot();Snd.ui();}saveNow();soundIcon();};
  $("#swSound").onclick=()=>{$("#btnSound").click();};
  $("#swVib").onclick=()=>{S.save.vib=!S.save.vib;saveNow();syncSettings();buzz(20);};
  $("#btnBack").onclick=()=>{stopTimer();Snd.ui();show("home");};
  $("#mPlay").onclick=()=>{Snd.ui();startPuzzle("level",Math.min(S.save.unlocked,TOTAL));};
  $("#mLevels").onclick=()=>{Snd.ui();show("levels");};
  $("#mZen").onclick=()=>{Snd.ui();show("zen");};
  $("#mHelp").onclick=()=>{Snd.ui();show("help");};
  $("#mSet").onclick=()=>{Snd.ui();show("settings");};
  $("#zenGo").onclick=()=>{Snd.ui();if(!S.save.diff){S.save.diff="normal";saveNow();}startPuzzle("zen",S.save.diff);};
  $("#board").addEventListener("click",e=>{const c=e.target.closest(".cell");if(c)onCellTap(+c.dataset.i);});
  $("#btnUndo").onclick=()=>{
    if(!G.board||G.solved||!G.undo.length){Snd.bad();return;}
    const last=G.undo.pop();G.board.setMirror(last.i,last.o);G.moves=Math.max(0,G.moves-1);updateHUD();
    Snd.tap(last.o);G.board.trace();G.board.paint();
  };
  $("#btnHint").onclick=()=>{
    if(!G.board||G.solved)return;
    const p=buildPuzzle(G.mode==="level"?"pp:"+G.id+":v1":"seed", G.mode==="level"?TIERS[tierOf(G.id)]:ZEN[G.id]);
    /* recompute intended solution deterministically */
    const sol=p.cells.map(c=>c.o);
    const wrong=G.board.mirrorIdx().filter(i=>G.board.cells[i].o!==sol[i]);
    if(!wrong.length){toast(t("par"));return;}
    const i=wrong[(Math.random()*wrong.length)|0];
    G.undo.push({i,o:G.board.cells[i].o});
    G.board.setMirror(i,sol[i]);G.hints++;Snd.ui();buzz(12);
    G.board.refs[i].el.classList.add("hintflash");setTimeout(()=>G.board.refs[i].el.classList.remove("hintflash"),1500);
    G.board.trace();G.board.paint();
    if(isSolved(G.board.C,G.board.R,G.board.cells))win();
  };
  $("#btnReset").onclick=()=>{
    if(!G.board||G.solved)return;Snd.ui();
    const seed=G.mode==="level"?"pp:"+G.id+":v1":G.seedZen||(G.seedZen="zen:"+G.id+":"+Date.now());
    const p=buildPuzzle(seed,G.mode==="level"?TIERS[tierOf(G.id)]:ZEN[G.id]);
    G.board=new Board($("#board"),p.C,p.R,p.cells,true);G.moves=0;G.undo=[];updateHUD();
    requestAnimationFrame(()=>{fitBoard(G.board);G.board.trace();G.board.paint();});
  };
  $("#btnExp").onclick=()=>{
    const code=encodeSave();
    openModal({title:t("exp"),sub:t("set_data_s"),
      body:`<textarea class="txt" id="codeBox" readonly>${code}</textarea>`,
      btns:[[t("copied"),"primary",()=>{
        const ta=$("#codeBox");ta.select();
        if(navigator.clipboard)navigator.clipboard.writeText(code).catch(()=>{});
        try{document.execCommand("copy");}catch(e){}toast(t("copied"));closeModal();}],
       [t("no"),"ghost",()=>closeModal()]]});
  };
  $("#btnImp").onclick=()=>{
    openModal({title:t("imp"),sub:t("set_data_s"),
      body:`<textarea class="txt" id="codeBox" placeholder="CODE..."></textarea>`,
      btns:[[t("imp"),"primary",()=>{
        try{S.save=decodeSave($("#codeBox").value);saveNow();pickLang();applyI18n();closeModal();toast(t("imp_ok"));show("home");}
        catch(e){toast(t("imp_err"));}
       }],[t("no"),"ghost",()=>closeModal()]]});
  };
  $("#btnWipe").onclick=()=>{
    openModal({title:t("reset_progress"),sub:t("reset_q"),btns:[
      [t("yes"),"danger",()=>{S.save=defSave();saveNow();pickLang();applyI18n();closeModal();show("home");}],
      [t("no"),"",()=>closeModal()]]});
  };
  $("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
  document.addEventListener("keydown",e=>{
    if(S.screen!=="game")return;
    const k=e.key.toLowerCase();
    if(k==="u")$("#btnUndo").click();else if(k==="h")$("#btnHint").click();else if(k==="r")$("#btnReset").click();
  });
  window.addEventListener("resize",()=>{if(G.board)fitBoard(G.board);if(S.demoBoard)fitBoard(S.demoBoard);});
  document.addEventListener("visibilitychange",()=>{if(document.hidden){if(G.timer)stopTimer();}else if(S.screen==="game"&&!G.solved)startTimer();});
  document.addEventListener("pointerdown",function once(){Snd.boot();Snd.resume();document.removeEventListener("pointerdown",once);},{once:true});

  applyI18n();show("home");
}
init();
</script>
